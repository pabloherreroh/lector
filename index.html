<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#18212F; --muted:#5A6476; --line:#D5DAE3;
  --accent:#2F43C9; --accent-ink:#FFFFFF; --mark:#FFE27A; --track:#DCE1EA;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs:19px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161F; --surface:#19202C; --ink:#E4E8F0; --muted:#98A2B5; --line:#2A3342;
    --accent:#8E9CFF; --accent-ink:#0E1330; --mark:rgba(255,212,84,.30); --track:#2A3342;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161F; --surface:#19202C; --ink:#E4E8F0; --muted:#98A2B5; --line:#2A3342;
  --accent:#8E9CFF; --accent-ink:#0E1330; --mark:rgba(255,212,84,.30); --track:#2A3342;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.view{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}

/* Biblioteca */
.lib-head{padding:28px 22px 14px}
.lib-head h1{font-family:var(--serif);font-weight:600;font-size:2.3rem;line-height:1.1;margin:0;letter-spacing:-.01em}
.lib-head p{margin:.4rem 0 0;color:var(--muted)}
.list{flex:1;overflow:auto;padding:0 22px 24px;-webkit-overflow-scrolling:touch}
.doc{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.doc-open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:16px 0 14px}
.doc-title{font-family:var(--serif);font-size:1.12rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc-meta{color:var(--muted);font-size:.88rem;margin-top:4px}
.bar{height:3px;background:var(--track);border-radius:2px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.doc-del{background:none;border:0;color:var(--muted);padding:0 4px 0 14px;display:flex;align-items:center}
.empty{padding:40px 4px;color:var(--muted);line-height:1.6;max-width:30em}
.empty strong{display:block;color:var(--ink);font-family:var(--serif);font-size:1.25rem;font-weight:600;margin-bottom:6px}
.actions{display:flex;gap:10px;padding:12px 22px 16px;border-top:1px solid var(--line);background:var(--bg)}
.btn{border-radius:999px;padding:13px 18px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:1}
.btn:disabled,.btn.busy{opacity:.5;pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Lector */
.topbar{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 4px;border-bottom:1px solid var(--line);background:var(--bg)}
.topbar h2{flex:1;min-width:0;margin:0;font-size:1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.icon svg{width:24px;height:24px}
.text-wrap{flex:1;position:relative;min-height:0}
#text{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.page{max-width:36em;margin:0 auto;padding:22px 22px 45vh;font-family:var(--serif);font-size:var(--fs);line-height:1.72;hyphens:auto;-webkit-hyphens:auto}
.page p{margin:0 0 .9em}
.page h3{font-size:1.3em;line-height:1.3;font-weight:600;margin:1.6em 0 .6em}
.page h3:first-child{margin-top:0}
.s{border-radius:3px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color .2s}
.s.on{background:linear-gradient(to bottom,transparent 8%,var(--mark) 8%,var(--mark) 92%,transparent 92%)}
.locate{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);border:0;border-radius:999px;padding:9px 16px;background:var(--ink);color:var(--bg);font-weight:700;font-size:.9rem;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.player{border-top:1px solid var(--line);background:var(--surface);padding:10px 18px 14px}
.prog{display:flex;flex-direction:column;gap:2px}
.prog input{width:100%;accent-color:var(--accent);margin:0;height:28px}
.prog-lbl{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:14px;margin-top:6px}
.chip{justify-self:start;border:1.5px solid var(--line);background:none;border-radius:999px;padding:7px 12px;font-weight:700;font-variant-numeric:tabular-nums;min-width:64px}
.chip.right{justify-self:end}
.play{width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.play svg{width:28px;height:28px}

/* Hojas */
dialog.sheet{margin:auto auto 0;width:100%;max-width:560px;border:0;border-radius:22px 22px 0 0;padding:8px 20px calc(22px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--ink);max-height:86vh;overflow:auto}
dialog.sheet::backdrop{background:rgba(8,12,20,.45)}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet h4{font-family:var(--serif);font-size:1.35rem;font-weight:600;margin:0 0 14px}
.field{margin:0 0 18px}
.field>label,.field>.lbl{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.field>label span,.field>.lbl span{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field select,.field input[type=text],.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg)}
.field textarea{min-height:34vh;resize:vertical;line-height:1.5}
.hint{color:var(--muted);font-size:.88rem;line-height:1.5;margin:6px 0 0}
.engines{display:flex;flex-direction:column;gap:8px}
.engine{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.engine input{accent-color:var(--accent);width:20px;height:20px;margin:0}
.engine b{display:block}
.engine small{color:var(--muted)}
.engine.off{opacity:.55}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:10px 6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.toc{list-style:none;margin:0;padding:0}
.toc button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 2px;font-family:var(--serif);line-height:1.35}
.toc button.here{color:var(--accent);font-weight:600}
.row{display:flex;gap:10px}
.row .btn{flex:1}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(92vw,480px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:.92rem;line-height:1.4;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.dl .bar{margin-top:12px}
.dl .btn{margin-top:10px}
</style>
</head>
<body>

<!-- BIBLIOTECA -->
<section id="library" class="view">
  <header class="lib-head">
    <h1>Biblioteca</h1>
    <p id="lib-count"></p>
  </header>
  <div class="list" id="doc-list"></div>
  <div class="actions">
    <label class="btn primary" id="btn-import" for="file" role="button" tabindex="0">Importar documento</label>
    <button class="btn" id="btn-paste">Pegar texto</button>
    <button class="btn" id="btn-install" hidden>Instalar</button>
  </div>
  <input type="file" id="file" class="vh">
</section>

<!-- LECTOR -->
<section id="reader" class="view" hidden>
  <header class="topbar">
    <button class="icon" id="btn-back" aria-label="Volver a la biblioteca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="r-title"></h2>
    <button class="icon" id="btn-toc" aria-label="Índice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></button>
    <button class="icon" id="btn-settings" aria-label="Ajustes de voz y lectura"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>
  <div class="text-wrap">
    <div id="text"><article class="page" id="page"></article></div>
    <button class="locate" id="btn-locate" hidden>Ir a la frase actual</button>
  </div>
  <footer class="player">
    <div class="prog">
      <input type="range" id="seek" min="0" max="0" value="0" aria-label="Posición en el documento">
      <div class="prog-lbl"><span id="pct">0 %</span><span id="left"></span></div>
    </div>
    <div class="controls">
      <button class="chip" id="btn-rate" aria-label="Cambiar velocidad">1,0×</button>
      <button class="icon" id="btn-prev" aria-label="Frase anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button class="play" id="btn-play" aria-label="Reproducir"><svg id="ico-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg id="ico-pause" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <button class="icon" id="btn-next" aria-label="Frase siguiente"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
      <button class="chip right" id="btn-voice">Voz</button>
    </div>
  </footer>
</section>

<audio id="audio" preload="auto" playsinline></audio>

<!-- AJUSTES -->
<dialog class="sheet" id="sheet-settings">
  <div class="grip"></div>
  <h4>Voz y lectura</h4>
  <div class="field">
    <div class="lbl">Motor de voz</div>
    <div class="engines" id="engines"></div>
  </div>
  <div class="field" id="f-natural">
    <label for="nvoice">Voz</label>
    <select id="nvoice"></select>
    <div class="dl">
      <div class="bar"><i id="dl-bar" style="width:0%"></i></div>
      <p class="hint" id="dl-status"></p>
      <button class="btn" id="btn-dl" style="width:100%">Descargar voz</button>
    </div>
  </div>
  <div class="field" id="f-system">
    <label for="voice">Voz</label>
    <select id="voice"></select>
    <p class="hint" id="voice-hint"></p>
  </div>
  <div class="field"><label for="rate">Velocidad <span id="rate-v"></span></label><input type="range" id="rate" min="0.5" max="2" step="0.05"></div>
  <div class="field" id="f-pitch"><label for="pitch">Tono <span id="pitch-v"></span></label><input type="range" id="pitch" min="0.5" max="1.5" step="0.05"></div>
  <div class="field"><label for="volume">Volumen <span id="volume-v"></span></label><input type="range" id="volume" min="0.1" max="1" step="0.05"></div>
  <div class="field"><button class="btn" id="btn-test" style="width:100%">Probar voz</button></div>
  <div class="field"><label for="font">Tamaño de letra <span id="font-v"></span></label><input type="range" id="font" min="15" max="28" step="1"></div>
  <div class="field">
    <div class="lbl">Apariencia</div>
    <div class="seg" id="theme-seg">
      <button data-v="auto">Automática</button><button data-v="light">Clara</button><button data-v="dark">Oscura</button>
    </div>
  </div>
  <button class="btn primary" style="width:100%" data-close>Listo</button>
</dialog>

<!-- PEGAR TEXTO -->
<dialog class="sheet" id="sheet-paste">
  <div class="grip"></div>
  <h4>Pegar texto</h4>
  <div class="field"><label for="paste-title">Título</label><input type="text" id="paste-title" placeholder="Sin título"></div>
  <div class="field"><label for="paste-body">Texto</label><textarea id="paste-body" placeholder="Pega aquí un artículo, un correo o cualquier texto"></textarea></div>
  <div class="row"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="btn-paste-save">Guardar y escuchar</button></div>
</dialog>

<!-- ÍNDICE -->
<dialog class="sheet" id="sheet-toc">
  <div class="grip"></div>
  <h4>Índice</h4>
  <ul class="toc" id="toc"></ul>
</dialog>

<div id="toast" role="status" hidden></div>

<script>
"use strict";
const $ = s => document.querySelector(s);

/* ---------- Ajustes ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const DEFAULTS = { engine:'natural', naturalVoice:'davefx', voiceURI:'', rate:1, pitch:1, volume:1, font:19, theme:'auto' };
const S = Object.assign({}, DEFAULTS, store.get('lector.settings', {}));
const saveSettings = () => store.set('lector.settings', S);

/* ---------- Avisos ---------- */
let toastTimer, toastKind = null;
function toast(msg, sticky, kind){
  const t = $('#toast'); t.textContent = msg; t.hidden = false; toastKind = kind || null; clearTimeout(toastTimer);
  if(!sticky) toastTimer = setTimeout(() => { t.hidden = true; toastKind = null; }, 3600);
}
function hideToast(kind){ if(kind && toastKind !== kind) return; $('#toast').hidden = true; toastKind = null; }

/* =====================================================================
   MOTORES DE VOZ
   Todos cumplen la misma interfaz, así el lector no depende de cuál se use:
     id, name, available()
     start(desde, h)  empieza a leer desde la frase "desde" y avisa con
                      h.onSentence(i), h.onEnd(), h.onError(msg), h.onBuffering(bool)
     stop()
     test(texto)      reproduce una frase de prueba
   Para añadir otra voz en el futuro basta con registrar otro objeto en ENGINES.
   ===================================================================== */

/* ---- 1. Voces del móvil (Web Speech) ---- */
const SystemEngine = {
  id:'system', name:'Voces del móvil', tok:0,
  available(){ return 'speechSynthesis' in window; },
  voices(){
    if(!this.available()) return [];
    return speechSynthesis.getVoices().map(v => ({ id:v.voiceURI, name:v.name, lang:v.lang, def:v.default, raw:v }));
  },
  pick(s){
    const vs = this.voices();
    return vs.find(v => v.id === s.voiceURI)
        || vs.find(v => /^es([-_]|$)/i.test(v.lang) && v.def)
        || vs.find(v => /^es[-_]ES/i.test(v.lang))
        || vs.find(v => /^es/i.test(v.lang)) || null;
  },
  speak(text, s){
    return new Promise(resolve => {
      const u = new SpeechSynthesisUtterance(text);
      const v = this.pick(s);
      if(v){ u.voice = v.raw; u.lang = v.lang; } else u.lang = 'es-ES';
      u.rate = s.rate; u.pitch = s.pitch; u.volume = s.volume;
      let done = false, started = false; const t0 = Date.now();
      const finish = r => { if(done) return; done = true; clearInterval(watch); resolve(r); };
      u.onstart = () => { started = true; };
      u.onend = () => finish('end');
      u.onerror = e => finish((e.error === 'interrupted' || e.error === 'canceled') ? 'cancel' : { error:e.error || 'error' });
      const watch = setInterval(() => {
        const busy = speechSynthesis.speaking || speechSynthesis.pending;
        if(!busy && (started || Date.now() - t0 > 1500)) finish('end');
        else if(!started && Date.now() - t0 > 8000) finish({ error:'nostart' });
      }, 400);
      this._u = u;
      if(speechSynthesis.paused) speechSynthesis.resume();
      speechSynthesis.speak(u);
    });
  },
  start(from, h){
    const busy = this.available() && (speechSynthesis.speaking || speechSynthesis.pending);
    this.stop(); const my = ++this.tok;
    if(busy) setTimeout(() => this.run(from, h, my), 80); else this.run(from, h, my);
  },
  async run(i, h, my){
    while(my === this.tok && i < R.flat.length){
      h.onSentence(i);
      const r = await this.speak(R.flat[i], S);
      if(my !== this.tok) return;
      if(r && r.error){ h.onError(r.error === 'nostart' ? 'La voz no responde. Prueba otra voz en Ajustes.' : 'No se ha podido reproducir esta frase.'); return; }
      i++;
    }
    if(my === this.tok) h.onEnd();
  },
  stop(){ this.tok++; if(this.available()) speechSynthesis.cancel(); },
  test(text){ this.stop(); this.speak(text, S); }
};

/* ---- 2. Voz natural (Piper, red neuronal que se ejecuta en el propio móvil) ---- */
const HF_BASE = 'https://huggingface.co/rhasspy/piper-voices/resolve/main/';
const NATURAL = [
  { id:'davefx',     model:'es/es_ES/davefx/medium/es_ES-davefx-medium.onnx',     name:'Davefx, España, voz masculina' },
  { id:'sharvard-f', model:'es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx', speaker:'F', name:'Sharvard, España, voz femenina' },
  { id:'sharvard-m', model:'es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx', speaker:'M', name:'Sharvard, España, voz masculina' },
  { id:'claude',     model:'es/es_MX/claude/high/es_MX-claude-high.onnx',          name:'Claude, México, calidad alta' },
  { id:'carlfm',     model:'es/es_ES/carlfm/x_low/es_ES-carlfm-x_low.onnx',        name:'Carlfm, España, ligera para móviles lentos' }
];

/* Este código se ejecuta en un hilo aparte (Web Worker) para no bloquear la pantalla. */
function workerMain(){
  const ORT = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/';
  const PH  = 'https://cdn.jsdelivr.net/npm/@diffusionstudio/piper-wasm@1.0.0/build/piper_phonemize';
  const HF  = ['https://huggingface.co/rhasspy/piper-voices/resolve/main/', 'https://huggingface.co/diffusionstudio/piper-voices/resolve/main/'];
  let libs = false, phon = null, session = null, cfg = null, loaded = null, minGen = 0, busy = false;
  const lines = [], jobs = [];
  const post = (m, t) => self.postMessage(m, t || []);

  function loadLibs(){
    if(libs) return;
    importScripts(ORT + 'ort.wasm.min.js', PH + '.js');
    ort.env.wasm.wasmPaths = ORT; ort.env.wasm.numThreads = 1; ort.env.wasm.proxy = false;
    libs = true;
  }
  async function fetchCached(key, urls, label, id){
    let cache = null;
    try{ cache = await caches.open('lector-voces'); const hit = await cache.match(key); if(hit) return await hit.arrayBuffer(); }catch(e){}
    let lastErr;
    for(const url of urls){
      try{
        const res = await fetch(url);
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const total = +res.headers.get('Content-Length') || 0;
        const rd = res.body.getReader(); const parts = []; let got = 0, last = 0;
        for(;;){
          const { done, value } = await rd.read(); if(done) break;
          parts.push(value); got += value.length;
          if(label && Date.now() - last > 300){ last = Date.now(); post({ type:'progress', label, got, total, id }); }
        }
        const blob = new Blob(parts);
        if(cache){ try{ await cache.put(key, new Response(blob)); }catch(e){} }
        return await blob.arrayBuffer();
      }catch(e){ lastErr = e; }
    }
    throw lastErr || new Error('download');
  }
  async function ensure(voice, id){
    loadLibs();
    if(!phon){
      const wasm = await fetchCached(PH + '.wasm', [PH + '.wasm'], null, id);
      const data = await fetchCached(PH + '.data', [PH + '.data'], 'Preparando el motor de voz', id);
      phon = await createPiperPhonemize({
        wasmBinary:wasm, getPreloadedPackage:() => data,
        print:l => lines.push(l), printErr:() => {},
        locateFile:f => f.endsWith('.wasm') ? PH + '.wasm' : PH + '.data'
      });
    }
    if(loaded !== voice.model){
      session = null; cfg = null; loaded = null;
      const js = await fetchCached(HF[0] + voice.model + '.json', HF.map(b => b + voice.model + '.json'), null, id);
      cfg = JSON.parse(new TextDecoder().decode(js));
      const buf = await fetchCached(HF[0] + voice.model, HF.map(b => b + voice.model), 'Descargando la voz', id);
      session = await ort.InferenceSession.create(new Uint8Array(buf), { executionProviders:['wasm'], graphOptimizationLevel:'all' });
      loaded = voice.model;
    }
  }
  function phonemize(texts){
    lines.length = 0;
    phon.callMain(['-l', cfg.espeak.voice, '--input', JSON.stringify(texts.map(t => ({ text:t }))), '--espeak_data', '/espeak-ng-data']);
    return lines.map(l => JSON.parse(l));
  }
  async function synth(job){
    await ensure(job.voice, job.id);
    let ph = phonemize(job.texts);
    if(ph.length !== job.texts.length) ph = job.texts.map(t => phonemize([t])[0] || { phonemes:[], phoneme_ids:[] });
    const inf = cfg.inference || {};
    const scales = Float32Array.from([inf.noise_scale ?? 0.667, inf.length_scale ?? 1, inf.noise_w ?? 0.8]);
    const sid = cfg.num_speakers > 1 ? ((cfg.speaker_id_map || {})[job.voice.speaker] ?? 0) : null;
    const pcm = [];
    for(const r of ph){
      if(job.gen < minGen) return null;
      if(!r.phonemes || !r.phonemes.length || !r.phoneme_ids || !r.phoneme_ids.length){ pcm.push(new Float32Array(0)); continue; }
      const ids = BigInt64Array.from(r.phoneme_ids, v => BigInt(v));
      const feeds = {
        input:new ort.Tensor('int64', ids, [1, ids.length]),
        input_lengths:new ort.Tensor('int64', BigInt64Array.from([BigInt(ids.length)]), [1]),
        scales:new ort.Tensor('float32', scales, [3])
      };
      if(sid !== null) feeds.sid = new ort.Tensor('int64', BigInt64Array.from([BigInt(sid)]), [1]);
      const out = await session.run(feeds);
      pcm.push(new Float32Array(out.output.data));
    }
    return { pcm, sr:cfg.audio.sample_rate };
  }
  async function pump(){
    if(busy) return; busy = true;
    while(jobs.length){
      const job = jobs.shift();
      if(job.type === 'synth' && job.gen < minGen) continue;
      try{
        if(job.type === 'prepare'){ await ensure(job.voice, job.id); post({ type:'ready', id:job.id }); }
        else{
          const r = await synth(job);
          if(r) post({ type:'audio', id:job.id, pcm:r.pcm, sr:r.sr }, r.pcm.map(a => a.buffer));
          else post({ type:'dropped', id:job.id });
        }
      }catch(e){ post({ type:'error', id:job.id, message:String((e && e.message) || e) }); }
    }
    busy = false;
  }
  self.onmessage = e => { const m = e.data; if(m.type === 'cancel'){ minGen = m.gen; return; } jobs.push(m); pump(); };
}

function wavBlob(chunks, total, sr){
  const buf = new ArrayBuffer(44 + total * 2), v = new DataView(buf);
  const str = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + total * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, total * 2, true);
  let o = 44;
  for(const c of chunks){
    if(typeof c === 'number'){ o += c * 2; continue; } // silencio (ya son ceros)
    for(let i = 0; i < c.length; i++){ const s = Math.max(-1, Math.min(1, c[i])); v.setInt16(o, s < 0 ? s * 32768 : s * 32767, true); o += 2; }
  }
  return new Blob([buf], { type:'audio/wav' });
}
let silentURL = null;
const SILENT = () => silentURL || (silentURL = URL.createObjectURL(wavBlob([11025], 11025, 22050)));

function friendly(msg){
  msg = String(msg || '');
  if(/quota/i.test(msg)) return 'No hay espacio suficiente en el móvil para guardar la voz.';
  if(/importScripts|NetworkError|Failed to fetch|Load failed|HTTP|download|network|Content Security|Refused/i.test(msg))
    return 'No se ha podido descargar la voz natural. Comprueba la conexión. Si estás dentro de Claude, abre la app desde su dirección de GitHub Pages.';
  return 'La voz natural ha fallado (' + msg.slice(0, 80) + '). Prueba otra voz o usa las voces del móvil.';
}

const Natural = {
  id:'natural', name:'Voz natural',
  w:null, seq:0, pending:new Map(), gen:1, queue:[], next:0, made:0, cur:null, urls:[], h:null, a:null, internalAt:0,
  available(){ return 'Worker' in window && 'caches' in window && window.isSecureContext && typeof BigInt64Array !== 'undefined'; },
  voice(){ return NATURAL.find(v => v.id === S.naturalVoice) || NATURAL[0]; },
  worker(){
    if(this.w) return this.w;
    const url = URL.createObjectURL(new Blob(['(' + workerMain.toString() + ')()'], { type:'text/javascript' }));
    this.w = new Worker(url);
    this.w.onmessage = e => this.onMsg(e.data);
    this.w.onerror = e => {
      const err = { error:friendly(e && e.message) };
      this.pending.forEach(p => p.resolve(err)); this.pending.clear();
      this.w = null;
    };
    return this.w;
  },
  send(msg){
    const id = ++this.seq;
    return new Promise(resolve => {
      this.pending.set(id, { resolve, gen:msg.gen });
      try{ this.worker().postMessage(Object.assign({}, msg, { id })); }
      catch(e){ this.pending.delete(id); resolve({ error:friendly(e && e.message) }); }
    });
  },
  onMsg(m){
    if(m.type === 'progress'){ onVoiceProgress(m); return; }
    const p = this.pending.get(m.id); if(!p) return;
    this.pending.delete(m.id);
    if(m.type === 'audio') p.resolve({ pcm:m.pcm, sr:m.sr });
    else if(m.type === 'ready') p.resolve({ ok:true });
    else if(m.type === 'error') p.resolve({ error:friendly(m.message) });
    else p.resolve({ dropped:true });
  },
  prepare(){ return this.send({ type:'prepare', voice:this.voice(), gen:0 }); },
  el(){
    if(this.a) return this.a;
    const a = this.a = $('#audio');
    a.addEventListener('timeupdate', () => this.tick());
    a.addEventListener('ended', () => { if(!a.loop) this.advance(this.gen); });
    a.addEventListener('pause', () => {
      // Pausa externa (auriculares desconectados, llamada, otra app)
      if(Date.now() - this.internalAt < 600 || a.ended || !R.playing || S.engine !== 'natural') return;
      pause();
    });
    return a;
  },
  start(from, h){
    this.stop();
    const gen = this.gen; this.h = h; this.next = from; this.made = 0; this.queue = []; this.cur = null;
    const a = this.el();
    this.internalAt = Date.now(); a.loop = true; a.src = SILENT(); a.play().catch(() => {});
    this.fill(gen); this.advance(gen);
  },
  stop(){
    this.gen++;
    if(this.w) this.w.postMessage({ type:'cancel', gen:this.gen });
    this.pending.forEach((p, id) => { if(p.gen) { p.resolve({ dropped:true }); this.pending.delete(id); } });
    this.queue = []; this.cur = null;
    if(this.a){ this.internalAt = Date.now(); this.a.pause(); this.a.loop = false; }
    while(this.urls.length) URL.revokeObjectURL(this.urls.shift());
  },
  segment(from){
    const lim = [1, 280, 560][Math.min(this.made++, 2)];
    const texts = []; let i = from, chars = 0;
    while(i < R.flat.length){
      const t = R.flat[i];
      if(texts.length && (chars + t.length > lim || texts.length >= 14)) break;
      texts.push(t); chars += t.length; i++;
      if(lim === 1) break;
    }
    return { start:from, end:i, texts };
  },
  fill(gen){
    while(this.queue.length < (document.hidden ? 8 : 3) && this.next < R.flat.length){
      const seg = this.segment(this.next); this.next = seg.end;
      seg.done = false;
      seg.p = this.send({ type:'synth', gen, voice:this.voice(), texts:seg.texts });
      seg.p.then(() => { seg.done = true; });
      this.queue.push(seg);
    }
  },
  async advance(gen){
    if(gen !== this.gen) return;
    const a = this.el();
    if(!this.queue.length){ this.cur = null; this.h.onEnd(); return; }
    const seg = this.queue.shift(); this.fill(gen);
    await Promise.resolve();
    if(!seg.done){
      this.h.onBuffering(true);
      if(!a.loop){ this.internalAt = Date.now(); a.loop = true; a.src = SILENT(); a.play().catch(() => {}); }
    }
    const r = await seg.p;
    if(gen !== this.gen || r.dropped) return;
    this.h.onBuffering(false);
    if(r.error){ this.h.onError(r.error); return; }
    // Une las frases con pausas naturales y apunta dónde empieza cada una
    const sr = r.sr, chunks = [], offsets = []; let total = 0;
    r.pcm.forEach((pc, k) => {
      offsets.push(total / sr);
      chunks.push(pc); total += pc.length;
      const gap = Math.round(sr * (R.pend.has(seg.start + k) ? 0.55 : 0.22));
      chunks.push(gap); total += gap;
    });
    const url = URL.createObjectURL(wavBlob(chunks, total, sr));
    this.urls.push(url);
    this.cur = { seg, offsets, last:-1 };
    this.internalAt = Date.now();
    a.loop = false; a.src = url;
    a.defaultPlaybackRate = S.rate; a.playbackRate = S.rate; a.preservesPitch = true; a.volume = S.volume;
    this.tick();
    try{ await a.play(); }
    catch(e){ if(gen === this.gen && e.name !== 'AbortError') this.h.onError('El móvil ha bloqueado el audio. Pulsa reproducir de nuevo.'); }
    while(this.urls.length > 1) URL.revokeObjectURL(this.urls.shift());
  },
  tick(){
    if(!this.cur || !this.a) return;
    const t = this.a.currentTime, o = this.cur.offsets; let k = 0;
    while(k + 1 < o.length && t >= o[k + 1]) k++;
    if(k !== this.cur.last){ this.cur.last = k; this.h.onSentence(this.cur.seg.start + k); }
  },
  setRate(r){ if(this.a){ this.a.defaultPlaybackRate = r; this.a.playbackRate = r; } },
  setVolume(v){ if(this.a) this.a.volume = v; },
  async test(text){
    this.stop();
    toast('Preparando la prueba', true, 'buf');
    const r = await this.send({ type:'synth', gen:this.gen, voice:this.voice(), texts:[text] });
    hideToast('buf'); hideToast('dl');
    if(r.error){ toast(r.error); return; }
    if(r.dropped) return;
    const au = new Audio(URL.createObjectURL(wavBlob(r.pcm, r.pcm[0].length, r.sr)));
    au.playbackRate = S.rate; au.volume = S.volume; au.play().catch(() => {});
  },
  async isStored(){
    try{
      const c = await caches.open('lector-voces');
      return !!(await c.match(HF_BASE + this.voice().model));
    }catch(e){ return false; }
  }
};

/* ---------- Almacenamiento de documentos (IndexedDB) ---------- */
const DB = (() => {
  let db = null; const mem = { meta:new Map(), content:new Map() };
  const open = () => new Promise(res => {
    try{
      const r = indexedDB.open('lector-docs', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('meta', { keyPath:'id' }); d.createObjectStore('content', { keyPath:'id' }); };
      r.onsuccess = () => { db = r.result; res(true); };
      r.onerror = () => res(false); r.onblocked = () => res(false);
    }catch(e){ res(false); }
  });
  const tx = (stores, mode, fn) => new Promise((res, rej) => {
    const t = db.transaction(stores, mode); const out = fn(t); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  return {
    open,
    async metas(){ return db ? (await tx('meta','readonly', t => t.objectStore('meta').getAll())) || [] : [...mem.meta.values()]; },
    async content(id){ return db ? tx('content','readonly', t => t.objectStore('content').get(id)) : mem.content.get(id); },
    async putMeta(m){ if(db) return tx('meta','readwrite', t => { t.objectStore('meta').put(m); }); mem.meta.set(m.id, m); },
    async add(m, c){ if(db) return tx(['meta','content'],'readwrite', t => { t.objectStore('meta').put(m); t.objectStore('content').put(c); }); mem.meta.set(m.id, m); mem.content.set(c.id, c); },
    async del(id){ if(db) return tx(['meta','content'],'readwrite', t => { t.objectStore('meta').delete(id); t.objectStore('content').delete(id); }); mem.meta.delete(id); mem.content.delete(id); }
  };
})();

/* ---------- Texto: frases y bloques ---------- */
const ABBR = /(?:^|\s)(?:Sr|Sra|Srta|Dr|Dra|Dña|Ud|Uds|pág|págs|núm|art|arts|etc|ej|vol|cap|fig|aprox|Avda|Excmo|Ilmo|D|p|c|n|S\.A|EE\.UU)\.$/i;
function splitSentences(p){
  p = p.replace(/\s+/g, ' ').trim(); if(!p) return [];
  const parts = p.match(/[^.!?…]+(?:[.!?…]+["'»”’)\]]*|$)\s*/g) || [p];
  const out = [];
  for(let s of parts){
    s = s.trim(); if(!s) continue;
    const prev = out[out.length - 1];
    if(prev && (ABBR.test(prev) || (/\d\.$/.test(prev) && /^\d/.test(s)) || prev.length < 4)) out[out.length - 1] = prev + ' ' + s;
    else out.push(s);
  }
  const res = [];
  for(const s of out){
    let rest = s;
    while(rest.length > 240){
      let cut = -1;
      for(const ch of [';', ':', ',', ' ']){ const k = rest.lastIndexOf(ch, 240); if(k > 80){ cut = k + 1; break; } }
      if(cut < 0) cut = 240;
      res.push(rest.slice(0, cut).trim()); rest = rest.slice(cut).trim();
    }
    if(rest) res.push(rest);
  }
  return res;
}
function makeBlocks(paras){
  const blocks = [];
  for(const p of paras){ const s = splitSentences(p.text); if(s.length) blocks.push({ h:!!p.h, s }); }
  return blocks;
}

/* ---------- Lectores de formatos ---------- */
function parsePlain(text, isMd){
  text = text.replace(/\r\n?/g, '\n');
  const chunks = /\n\s*\n/.test(text) ? text.split(/\n\s*\n/) : text.split('\n');
  return chunks.map(c => {
    let t = c.trim(); let h = false;
    if(isMd){
      if(/^#{1,6}\s/.test(t)){ h = true; t = t.replace(/^#{1,6}\s+/, ''); }
      t = t.replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[*_`>]+/g, '').replace(/^\s*[-+]\s+/gm, '');
    }
    return { text:t.replace(/\n/g, ' '), h };
  }).filter(p => p.text);
}

async function parsePDF(file, prog){
  const lib = window.pdfjsLib;
  if(!lib) throw new Error('No se ha podido cargar el lector de PDF. Comprueba la conexión y vuelve a intentarlo.');
  if(!window.pdfjsWorker && window['pdfjs-dist/build/pdf.worker']) window.pdfjsWorker = window['pdfjs-dist/build/pdf.worker'];
  lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await lib.getDocument({ data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false }).promise;
  let title = '';
  try{ const md = await pdf.getMetadata(); title = ((md.info && md.info.Title) || '').trim(); }catch(e){}
  const pages = [];
  for(let n = 1; n <= pdf.numPages; n++){
    prog(`Leyendo página ${n} de ${pdf.numPages}`);
    const tc = await (await pdf.getPage(n)).getTextContent();
    const lines = []; let cur = '', y = null, h = 0, endX = null;
    const flush = () => { const t = cur.replace(/\s+/g, ' ').trim(); if(t) lines.push({ t, y, h }); cur = ''; h = 0; endX = null; };
    for(const it of tc.items){
      if(typeof it.str !== 'string') continue;
      const x = it.transform[4], iy = it.transform[5], ih = Math.hypot(it.transform[2], it.transform[3]) || it.height || 10;
      if(y !== null && cur && Math.abs(iy - y) > ih * 0.6) flush();
      if(cur && endX !== null && x - endX > ih * 0.2 && !/\s$/.test(cur) && !/^\s/.test(it.str)) cur += ' ';
      cur += it.str;
      if(it.str.trim()){ y = iy; h = Math.max(h, ih); endX = x + (it.width || 0); }
      if(it.hasEOL) flush();
    }
    flush();
    pages.push(lines.filter(l => !/^(\d{1,4}|página \d+( de \d+)?|\d+ \/ \d+)$/i.test(l.t)));
  }
  const all = pages.flat();
  if(all.reduce((a, l) => a + l.t.length, 0) < 20) throw new Error('Este PDF no contiene texto seleccionable, parece un documento escaneado.');
  const med = arr => { const a = arr.filter(v => v > 0).sort((p, q) => p - q); return a.length ? a[Math.floor(a.length / 2)] : 0; };
  const bodyH = med(all.map(l => l.h)) || 10;
  const paras = []; let acc = null;
  const push = () => { if(acc && acc.text.trim()) paras.push(acc); acc = null; };
  const join = (a, b) => (/[a-záéíóúñü]-$/i.test(a) && /^[a-záéíóúñü]/.test(b)) ? a.slice(0, -1) + b : a + ' ' + b;
  for(const lines of pages){
    const gap = med(lines.slice(1).map((l, i) => lines[i].y - l.y));
    lines.forEach((l, i) => {
      const heading = l.h > bodyH * 1.25 && l.t.length < 140;
      if(heading){
        if(acc && acc.h){ acc.text += ' ' + l.t; return; }
        push(); acc = { text:l.t, h:true }; return;
      }
      let brk = !acc || acc.h;
      if(!brk){
        if(i === 0) brk = /[.!?:»”"]$/.test(acc.text);
        else { const g = lines[i - 1].y - l.y; brk = g < 0 || (gap && g > gap * 1.45); }
      }
      if(brk){ push(); acc = { text:l.t, h:false }; }
      else acc.text = join(acc.text, l.t);
    });
  }
  push();
  return { title, paras };
}

function resolvePath(base, rel){
  const out = [];
  for(const p of (base + rel).split('/')){ if(p === '..') out.pop(); else if(p && p !== '.') out.push(p); }
  return out.join('/');
}
function extractBlocks(root, out){
  const BLOCK = /^(p|h[1-6]|li|blockquote|dd|dt|pre|figcaption|td|th)$/;
  const CONTAINER = /^(p|div|h[1-6]|ul|ol|li|blockquote|section|article|table|aside|header|footer|figure)$/;
  const walk = el => {
    for(const c of el.children){
      const n = (c.localName || '').toLowerCase();
      if(n === 'script' || n === 'style' || n === 'head') continue;
      const hasBlock = [...c.children].some(x => CONTAINER.test((x.localName || '').toLowerCase()));
      if((BLOCK.test(n) || n === 'div') && !hasBlock){
        const t = c.textContent.replace(/\s+/g, ' ').trim();
        if(t) out.push({ text:t, h:/^h[1-6]$/.test(n) });
      } else walk(c);
    }
  };
  walk(root);
}
async function parseEPUB(file, prog){
  if(!window.JSZip) throw new Error('No se ha podido cargar el lector de EPUB. Comprueba la conexión y vuelve a intentarlo.');
  const zip = await JSZip.loadAsync(file);
  const read = p => { const f = zip.file(p) || zip.file(decodeURIComponent(p)); return f ? f.async('string') : Promise.resolve(null); };
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const cont = await read('META-INF/container.xml');
  if(!cont) throw new Error('El EPUB está dañado o no tiene un formato válido.');
  const opfPath = xml(cont).getElementsByTagNameNS('*', 'rootfile')[0]?.getAttribute('full-path');
  const opfText = opfPath && await read(opfPath);
  if(!opfText) throw new Error('El EPUB está dañado o no tiene un formato válido.');
  const opf = xml(opfText);
  const base = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
  const title = (opf.getElementsByTagNameNS('*', 'title')[0]?.textContent || '').trim();
  const man = {};
  for(const it of opf.getElementsByTagNameNS('*', 'item')) man[it.getAttribute('id')] = it.getAttribute('href');
  const spine = [...opf.getElementsByTagNameNS('*', 'itemref')].map(r => man[r.getAttribute('idref')]).filter(Boolean);
  const paras = [];
  for(let i = 0; i < spine.length; i++){
    prog(`Leyendo sección ${i + 1} de ${spine.length}`);
    const s = await read(resolvePath(base, decodeURIComponent(spine[i].split('#')[0])));
    if(!s) continue;
    let doc = new DOMParser().parseFromString(s, 'application/xhtml+xml');
    if(doc.getElementsByTagName('parsererror').length) doc = new DOMParser().parseFromString(s, 'text/html');
    const body = doc.getElementsByTagNameNS('*', 'body')[0] || doc.documentElement;
    extractBlocks(body, paras);
  }
  return { title, paras };
}

async function parseDOCX(file){
  if(!window.JSZip) throw new Error('No se ha podido cargar el lector de Word. Comprueba la conexión y vuelve a intentarlo.');
  const zip = await JSZip.loadAsync(file);
  const s = await zip.file('word/document.xml')?.async('string');
  if(!s) throw new Error('El archivo de Word está dañado o no es un .docx válido.');
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const d = new DOMParser().parseFromString(s, 'application/xml');
  const paras = [];
  for(const p of d.getElementsByTagNameNS(W, 'p')){
    let t = '';
    const walk = n => {
      for(const c of n.childNodes){
        if(c.nodeType !== 1) continue;
        const ln = c.localName;
        if(ln === 't') t += c.textContent;
        else if(ln === 'tab' || ln === 'br' || ln === 'cr') t += ' ';
        else if(!['pPr','rPr','instrText','delText','p'].includes(ln)) walk(c);
      }
    };
    walk(p);
    const st = p.getElementsByTagNameNS(W, 'pStyle')[0]?.getAttributeNS(W, 'val') || '';
    if(t.trim()) paras.push({ text:t, h:/^(heading|t[ií]?tulo|title)/i.test(st) });
  }
  let title = '';
  try{ const core = await zip.file('docProps/core.xml')?.async('string'); if(core) title = (new DOMParser().parseFromString(core, 'application/xml').getElementsByTagNameNS('*', 'title')[0]?.textContent || '').trim(); }catch(e){}
  return { title, paras };
}



/* ---------- Biblioteca ---------- */
const KIND = { pdf:'PDF', epub:'EPUB', docx:'Word', txt:'Texto', md:'Texto', paste:'Texto pegado' };
async function renderLibrary(){
  const docs = (await DB.metas()).sort((a, b) => (b.opened || b.added) - (a.opened || a.added));
  $('#lib-count').textContent = docs.length ? (docs.length === 1 ? '1 documento' : `${docs.length} documentos`) : '';
  const list = $('#doc-list'); list.innerHTML = '';
  if(!docs.length){
    list.innerHTML = '<div class="empty"><strong>Todavía no hay nada que escuchar</strong>Importa un PDF, EPUB, Word o TXT desde el móvil, o pega un texto copiado de cualquier sitio.</div>';
    return;
  }
  for(const m of docs){
    const pct = m.total > 1 ? Math.round(m.pos / (m.total - 1) * 100) : 0;
    const row = document.createElement('div'); row.className = 'doc';
    row.innerHTML = `<button class="doc-open"><div class="doc-title"></div><div class="doc-meta"></div><div class="bar"><i style="width:${pct}%"></i></div></button>
      <button class="doc-del" aria-label="Eliminar documento"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg></button>`;
    row.querySelector('.doc-title').textContent = m.title;
    row.querySelector('.doc-meta').textContent = `${KIND[m.kind] || 'Documento'}, ${pct ? pct + ' % escuchado' : 'sin empezar'}`;
    row.querySelector('.doc-open').onclick = () => openDoc(m.id);
    row.querySelector('.doc-del').onclick = async () => { if(confirm(`¿Eliminar «${m.title}» de la biblioteca?`)){ await DB.del(m.id); renderLibrary(); } };
    list.appendChild(row);
  }
}
async function saveDoc(title, kind, paras){
  const blocks = makeBlocks(paras);
  const total = blocks.reduce((a, b) => a + b.s.length, 0);
  if(!total) throw new Error('No se ha encontrado texto que leer en este documento.');
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const meta = { id, title:title || 'Sin título', kind, added:Date.now(), opened:0, pos:0, total };
  await DB.add(meta, { id, blocks });
  return id;
}
async function importFile(file){
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const baseName = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
  const prog = m => toast(m, true, 'imp');
  $('#btn-import').classList.add('busy');
  try{
    prog('Preparando el documento');
    let r;
    if(ext === 'pdf') r = await parsePDF(file, prog);
    else if(ext === 'epub') r = await parseEPUB(file, prog);
    else if(ext === 'docx') r = await parseDOCX(file);
    else if(ext === 'txt' || ext === 'md') r = { title:'', paras:parsePlain(await file.text(), ext === 'md') };
    else throw new Error('Formato no compatible. Usa PDF, EPUB, Word (.docx) o TXT.');
    const id = await saveDoc(r.title && r.title.length > 2 ? r.title : baseName, ext, r.paras);
    hideToast('imp'); await renderLibrary(); openDoc(id);
  }catch(e){ console.error(e); toast(e && e.message ? e.message : 'No se ha podido abrir el archivo.'); }
  finally{ $('#btn-import').classList.remove('busy'); }
}

/* ---------- Lector ---------- */
const R = { meta:null, flat:[], els:[], cum:[], toc:[], pend:new Set(), idx:0, playing:false, ended:false, cur:null, userScroll:0 };

async function openDoc(id){
  const meta = (await DB.metas()).find(m => m.id === id);
  const content = await DB.content(id);
  if(!meta || !content){ toast('No se encuentra este documento.'); return; }
  pause();
  Object.assign(R, { meta, flat:[], els:[], cum:[0], toc:[], pend:new Set(), cur:null, ended:false });
  const page = $('#page'); page.innerHTML = '';
  const frag = document.createDocumentFragment(); let gi = 0;
  for(const b of content.blocks){
    const el = document.createElement(b.h ? 'h3' : 'p');
    if(b.h) R.toc.push({ i:gi, t:b.s.join(' ') });
    b.s.forEach((s, k) => {
      if(k) el.appendChild(document.createTextNode(' '));
      const sp = document.createElement('span'); sp.className = 's'; sp.dataset.i = gi; sp.textContent = s;
      el.appendChild(sp); R.els.push(sp); R.flat.push(s); R.cum.push(R.cum[gi] + s.length); gi++;
    });
    R.pend.add(gi - 1);
    frag.appendChild(el);
  }
  page.appendChild(frag);
  $('#r-title').textContent = meta.title;
  $('#seek').max = Math.max(0, R.flat.length - 1);
  $('#library').hidden = true; $('#reader').hidden = false;
  R.idx = Math.min(meta.pos || 0, R.flat.length - 1);
  mark(R.idx, true);
  meta.opened = Date.now(); DB.putMeta(meta);
  ui();
}
function closeReader(){ pause(); $('#reader').hidden = true; $('#library').hidden = false; renderLibrary(); }

function mark(i, force){
  if(R.cur) R.cur.classList.remove('on');
  const el = R.els[i]; if(!el) return;
  el.classList.add('on'); R.cur = el;
  if(document.visibilityState === 'visible') follow(el, force);
  progress();
}
function follow(el, force){
  if(!force && Date.now() - R.userScroll < 5000) return;
  const box = $('#text').getBoundingClientRect(), r = el.getBoundingClientRect();
  if(force || r.top < box.top + box.height * 0.15 || r.bottom > box.top + box.height * 0.7){
    el.scrollIntoView({ block:'center', behavior:force ? 'auto' : 'smooth' });
  }
  $('#btn-locate').hidden = true;
}
function fmtLeft(sec){
  if(sec < 60) return 'Queda menos de 1 min';
  const m = Math.round(sec / 60), h = Math.floor(m / 60);
  return h ? `Quedan ${h} h ${m % 60} min` : `Quedan ${m} min`;
}
function progress(){
  const n = R.flat.length; if(!n) return;
  $('#seek').value = R.idx;
  $('#pct').textContent = (n > 1 ? Math.round(R.idx / (n - 1) * 100) : 100) + ' %';
  $('#left').textContent = fmtLeft((R.cum[n] - R.cum[R.idx]) / (14 * S.rate));
}
let saveTimer;
function savePos(now){
  if(!R.meta) return;
  R.meta.pos = R.idx; clearTimeout(saveTimer);
  const doSave = () => DB.putMeta(R.meta).catch(() => {});
  if(now) doSave(); else saveTimer = setTimeout(doSave, 800);
}

const handlers = {
  onSentence(i){ R.idx = i; mark(i); savePos(); },
  onEnd(){ R.playing = false; R.ended = true; ui(); wake(false); savePos(true); media(); toast('Has llegado al final.'); },
  onError(msg){ stopAll(); R.playing = false; ui(); wake(false); media(); hideToast('buf'); hideToast('dl'); toast(msg); },
  onBuffering(on){ if(on){ if(toastKind !== 'dl') toast('Preparando audio', true, 'buf'); } else { hideToast('buf'); hideToast('dl'); } }
};
function play(){
  if(!R.flat.length) return;
  const eng = engine();
  if(!eng.available()){
    toast(eng.id === 'natural' ? 'Este navegador no admite la voz natural. Elige las voces del móvil en Ajustes.' : 'Este navegador no permite leer en voz alta.');
    return;
  }
  if(R.ended){ R.idx = 0; R.ended = false; }
  R.playing = true; ui(); media();
  if(eng.id === 'system') wake(true);
  eng.start(R.idx, handlers);
}
function pause(){
  const was = R.playing;
  R.playing = false; stopAll();
  if(was) savePos(true);
  ui(); wake(false); media(); hideToast('buf');
}
function jump(i){
  if(!R.flat.length) return;
  i = Math.max(0, Math.min(R.flat.length - 1, i));
  R.idx = i; R.ended = false; mark(i, true); savePos();
  if(R.playing) engine().start(i, handlers);
}
function ui(){
  $('#ico-play').hidden = R.playing; $('#ico-pause').hidden = !R.playing;
  $('#btn-play').setAttribute('aria-label', R.playing ? 'Pausar' : 'Reproducir');
  $('#btn-rate').textContent = S.rate.toFixed(Math.round(S.rate * 100) % 10 ? 2 : 1).replace('.', ',') + '×';
}

/* Pantalla encendida (solo hace falta con las voces del móvil) */
let lock = null;
async function wake(on){
  try{
    if(on && 'wakeLock' in navigator && !lock){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); }
    else if(!on && lock){ await lock.release(); lock = null; }
  }catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if(document.hidden && R.playing && S.engine === 'natural') Natural.fill(Natural.gen);
  if(document.visibilityState === 'visible'){ if(R.playing && S.engine === 'system') wake(true); if(R.cur) follow(R.cur, true); }
});

/* Controles en la pantalla de bloqueo y en los auriculares */
let artURL = null;
function art(){
  if(artURL) return artURL;
  try{
    const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
    x.fillStyle = '#2F43C9'; x.fillRect(0, 0, 512, 512);
    x.font = '300px serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('🎧', 256, 280);
    artURL = c.toDataURL('image/png');
  }catch(e){ artURL = ''; }
  return artURL;
}
function media(){
  if(!('mediaSession' in navigator)) return;
  try{
    if(R.meta) navigator.mediaSession.metadata = new MediaMetadata({ title:R.meta.title, artist:'Lector', artwork:art() ? [{ src:art(), sizes:'512x512', type:'image/png' }] : [] });
    navigator.mediaSession.playbackState = R.playing ? 'playing' : 'paused';
  }catch(e){}
}
if('mediaSession' in navigator){
  const set = (a, f) => { try{ navigator.mediaSession.setActionHandler(a, f); }catch(e){} };
  set('play', () => play()); set('pause', () => pause()); set('stop', () => pause());
  set('previoustrack', () => jump(R.idx - 1)); set('nexttrack', () => jump(R.idx + 1));
  set('seekbackward', () => jump(R.idx - 3)); set('seekforward', () => jump(R.idx + 3));
}

/* ---------- Hoja de ajustes ---------- */
function fillVoices(){
  const sel = $('#voice'); const vs = SystemEngine.voices(); sel.innerHTML = '';
  const cur = SystemEngine.pick(S);
  const es = vs.filter(v => /^es/i.test(v.lang)), other = vs.filter(v => !/^es/i.test(v.lang));
  const group = (label, arr) => {
    if(!arr.length) return;
    const g = document.createElement('optgroup'); g.label = label;
    arr.forEach(v => { const o = document.createElement('option'); o.value = v.id; o.textContent = `${v.name} (${v.lang})`; if(cur && v.id === cur.id) o.selected = true; g.appendChild(o); });
    sel.appendChild(g);
  };
  group('Español', es); group('Otros idiomas', other);
  if(!vs.length){ const o = document.createElement('option'); o.textContent = 'Cargando voces'; sel.appendChild(o); }
  $('#voice-hint').textContent = !es.length && vs.length ? 'No hay voces en español instaladas en este dispositivo.'
    : 'Para mejorarlas, elige «Servicios de voz de Google» como motor de texto a voz en los ajustes del móvil y descarga el español.';
}
async function fillNatural(){
  const sel = $('#nvoice'); sel.innerHTML = '';
  let cache = null; try{ cache = await caches.open('lector-voces'); }catch(e){}
  for(const v of NATURAL){
    const o = document.createElement('option'); o.value = v.id;
    const stored = cache ? !!(await cache.match(HF_BASE + v.model)) : false;
    o.textContent = v.name + (stored ? ' (descargada)' : '');
    if(v.id === Natural.voice().id) o.selected = true;
    sel.appendChild(o);
  }
  const stored = await Natural.isStored();
  $('#dl-bar').style.width = stored ? '100%' : '0%';
  $('#dl-status').textContent = stored ? 'Descargada en el móvil, funciona sin conexión.' : 'Se descarga una sola vez, entre 30 y 80 MB. Mejor con wifi.';
  $('#btn-dl').hidden = stored;
}
function fillEngines(){
  const box = $('#engines'); box.innerHTML = '';
  const add = (e, note) => {
    const l = document.createElement('label'); const ok = e.available(); l.className = 'engine' + (ok ? '' : ' off');
    l.innerHTML = `<input type="radio" name="engine" value="${e.id}" ${ok ? '' : 'disabled'} ${S.engine === e.id ? 'checked' : ''}><div><b></b><small></small></div>`;
    l.querySelector('b').textContent = e.name; l.querySelector('small').textContent = ok ? note : 'No disponible en este navegador';
    if(ok) l.querySelector('input').onchange = () => { pause(); S.engine = e.id; saveSettings(); showEngineFields(); };
    box.appendChild(l);
  };
  add(Natural, 'Suena natural y sigue leyendo con el móvil bloqueado');
  add(SystemEngine, 'Sin descargas, calidad robótica, necesita la pantalla encendida');
}
function showEngineFields(){
  const nat = S.engine === 'natural';
  $('#f-natural').hidden = !nat; $('#f-system').hidden = nat; $('#f-pitch').hidden = nat;
  if(nat) fillNatural(); else fillVoices();
}
const fmtNum = v => Number(v).toFixed(2).replace('.', ',');
function syncSettingsUI(){
  $('#rate').value = S.rate; $('#rate-v').textContent = fmtNum(S.rate) + '×';
  $('#pitch').value = S.pitch; $('#pitch-v').textContent = fmtNum(S.pitch);
  $('#volume').value = S.volume; $('#volume-v').textContent = Math.round(S.volume * 100) + ' %';
  $('#font').value = S.font; $('#font-v').textContent = S.font + ' px';
  document.querySelectorAll('#theme-seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.theme));
}
function applyLook(){
  document.documentElement.style.setProperty('--fs', S.font + 'px');
  if(S.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = S.theme;
}
function openSettings(){ fillEngines(); showEngineFields(); syncSettingsUI(); $('#sheet-settings').showModal(); }

/* ---------- Eventos ---------- */
$('#btn-import').onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); $('#file').click(); } };
$('#file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if(f) importFile(f); };
$('#btn-paste').onclick = () => { $('#paste-title').value = ''; $('#paste-body').value = ''; $('#sheet-paste').showModal(); };
$('#btn-paste-save').onclick = async () => {
  const text = $('#paste-body').value.trim();
  if(!text){ toast('Pega algún texto para poder guardarlo.'); return; }
  const title = $('#paste-title').value.trim() || text.split(/\s+/).slice(0, 7).join(' ') + '…';
  try{ const id = await saveDoc(title, 'paste', parsePlain(text, false)); $('#sheet-paste').close(); await renderLibrary(); openDoc(id); }
  catch(e){ toast(e.message || 'No se ha podido guardar el texto.'); }
};
$('#btn-back').onclick = closeReader;
$('#btn-play').onclick = () => R.playing ? pause() : play();
$('#btn-prev').onclick = () => jump(R.idx - 1);
$('#btn-next').onclick = () => jump(R.idx + 1);
$('#btn-settings').onclick = openSettings;
$('#btn-voice').onclick = openSettings;
function setRate(r){ S.rate = r; saveSettings(); Natural.setRate(r); ui(); progress(); }
const RATES = [0.8, 1, 1.2, 1.4, 1.6, 1.8, 2];
$('#btn-rate').onclick = () => { const i = RATES.findIndex(r => r > S.rate + 0.001); setRate(i < 0 ? RATES[0] : RATES[i]); };
$('#seek').oninput = e => { const i = +e.target.value, n = R.flat.length; $('#pct').textContent = (n > 1 ? Math.round(i / (n - 1) * 100) : 100) + ' %'; };
$('#seek').onchange = e => jump(+e.target.value);
$('#page').addEventListener('click', e => { const s = e.target.closest('.s'); if(s && !window.getSelection().toString()) jump(+s.dataset.i); });
const noteScroll = () => { R.userScroll = Date.now(); };
['touchmove', 'wheel'].forEach(ev => $('#text').addEventListener(ev, noteScroll, { passive:true }));
$('#text').addEventListener('scroll', () => {
  if(!R.cur || Date.now() - R.userScroll > 5000) return;
  const box = $('#text').getBoundingClientRect(), r = R.cur.getBoundingClientRect();
  $('#btn-locate').hidden = r.bottom > box.top && r.top < box.bottom;
}, { passive:true });
$('#btn-locate').onclick = () => { R.userScroll = 0; follow(R.cur, true); };
$('#btn-toc').onclick = () => {
  const ul = $('#toc'); ul.innerHTML = '';
  if(!R.toc.length) ul.innerHTML = '<li class="hint">No se han detectado capítulos en este documento.</li>';
  let here = -1; R.toc.forEach((t, k) => { if(t.i <= R.idx) here = k; });
  R.toc.forEach((t, k) => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.textContent = t.t; if(k === here) b.className = 'here';
    b.onclick = () => { $('#sheet-toc').close(); jump(t.i); };
    li.appendChild(b); ul.appendChild(li);
  });
  $('#sheet-toc').showModal();
};
$('#voice').onchange = e => { S.voiceURI = e.target.value; saveSettings(); };
$('#nvoice').onchange = e => { pause(); S.naturalVoice = e.target.value; saveSettings(); fillNatural(); };
$('#btn-dl').onclick = async () => {
  const b = $('#btn-dl'); b.classList.add('busy'); $('#dl-status').textContent = 'Empezando la descarga';
  const r = await Natural.prepare();
  b.classList.remove('busy'); hideToast('dl');
  if(r.error){ $('#dl-status').textContent = r.error; return; }
  fillNatural();
};
$('#rate').oninput = e => { setRate(+e.target.value); syncSettingsUI(); };
$('#pitch').oninput = e => { S.pitch = +e.target.value; saveSettings(); syncSettingsUI(); };
$('#volume').oninput = e => { S.volume = +e.target.value; saveSettings(); Natural.setVolume(S.volume); syncSettingsUI(); };
$('#font').oninput = e => { S.font = Math.round(+e.target.value); saveSettings(); syncSettingsUI(); applyLook(); };
document.querySelectorAll('#theme-seg button').forEach(b => b.onclick = () => { S.theme = b.dataset.v; saveSettings(); syncSettingsUI(); applyLook(); });
$('#btn-test').onclick = () => { pause(); engine().test('Hola. Esta es la voz con la que voy a leer tus documentos.'); };
document.querySelectorAll('dialog.sheet').forEach(d => {
  d.addEventListener('click', e => { if(e.target === d || e.target.hasAttribute('data-close')) d.close(); });
});
if('speechSynthesis' in window) speechSynthesis.addEventListener('voiceschanged', () => { if($('#sheet-settings').open && S.engine === 'system') fillVoices(); });
window.addEventListener('pagehide', () => savePos(true));

/* ---------- App instalable ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#btn-install').hidden = false; });
window.addEventListener('appinstalled', () => { installEvt = null; $('#btn-install').hidden = true; toast('App instalada. Ya la tienes en la pantalla de inicio.'); });
$('#btn-install').onclick = async () => {
  if(!installEvt) return;
  installEvt.prompt();
  try{ await installEvt.userChoice; }catch(e){}
  installEvt = null; $('#btn-install').hidden = true;
};
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

/* ---------- Inicio ---------- */
(async () => {
  if(!Natural.available() && S.engine === 'natural') S.engine = 'system';
  applyLook(); ui();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  const ok = await DB.open();
  if(!ok) toast('Este navegador no permite guardar documentos; se perderán al cerrar la página.');
  renderLibrary();
})();

</script>
